name: rental_v3
description: A multi-account rental management mobile application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.4.9

  # Routing
  go_router: ^13.0.0

  # HTTP client
  dio: ^5.4.0

  # Secure storage
  flutter_secure_storage: ^9.0.0

  # Local notifications
  flutter_local_notifications: ^16.3.0

  # Image picker
  image_picker: ^1.0.5

  # PDF viewer
  flutter_pdfview: ^1.3.2

  # Image caching
  cached_network_image: ^3.3.0

  # Internationalization
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
